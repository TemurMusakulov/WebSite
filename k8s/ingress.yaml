apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: temur-portfolio
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    # Replace with your real host, e.g. portfolio.example.com
    - host: temur-portfolio.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: temur-portfolio
                port:
                  number: 80
